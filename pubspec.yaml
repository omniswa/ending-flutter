name: ending
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^4.5.2
  cached_network_image: ^4.0.5
  characters: ^1.4.1
  file_picker: ^13.2.0
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  html: ^0.15.6
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  positioned_sliver_list: ^0.2.4
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/google_fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/google_fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/google_fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Fraunces-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Fraunces-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-Regular.ttf
        - asset: assets/google_fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Literata
      fonts:
        - asset: assets/google_fonts/Literata-Regular.ttf
        - asset: assets/google_fonts/Literata-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/google_fonts/Lora-Regular.ttf
        - asset: assets/google_fonts/Lora-Bold.ttf
          weight: 700
    - family: Merriweather
      fonts:
        - asset: assets/google_fonts/Merriweather-Regular.ttf
        - asset: assets/google_fonts/Merriweather-Bold.ttf
          weight: 700
